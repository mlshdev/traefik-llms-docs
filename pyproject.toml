[project]
name = "traefik-llms-docs"
version = "1.0.0"
description = "Convert the Traefik Proxy documentation into LLM-friendly Markdown and llms.txt"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "mlshdev" }]
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
traefik-llms-docs = "traefik_llms_docs.cli:main"

[project.urls]
Homepage = "https://github.com/mlshdev/traefik-llms-docs"
Upstream = "https://github.com/traefik/traefik"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traefik_llms_docs"]

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.16.1", "ty>=0.0.63", "types-PyYAML>=6.0.12"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "C4", "TCH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test signatures are pytest fixtures, not a public API; TC* would push the
# annotations pytest reads into a TYPE_CHECKING block for no benefit.
"tests/*" = ["ANN001", "ANN201", "TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ty.environment]
python-version = "3.14"
